<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#f3f5f8"/>
<rect x="335" y="35" width="530" height="690" rx="48" fill="#202631"/>
<rect x="355" y="75" width="490" height="610" rx="30" fill="#fff"/>
<rect x="540" y="50" width="120" height="12" rx="6" fill="#596273"/>
<text x="600" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#1d2733">Messages</text>
<text x="390" y="165" font-family="Arial,sans-serif" font-size="18" fill="#6b7280">Illustrative reconstruction</text>
<rect x="385" y="190" width="420" height="365" rx="24" fill="#eef1f5"/>
<text x="415" y="235" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#263244">Traffic challan alert</text>
<text x="415" y="285" font-family="Arial,sans-serif" font-size="21" fill="#263244">A message claims that an</text>
<text x="415" y="318" font-family="Arial,sans-serif" font-size="21" fill="#263244">outstanding fine of ₹500 is due.</text>
<text x="415" y="370" font-family="Arial,sans-serif" font-size="20" fill="#263244">It includes vehicle and reference</text>
<text x="415" y="402" font-family="Arial,sans-serif" font-size="20" fill="#263244">details to appear personalised.</text>
<rect x="410" y="435" width="365" height="78" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="430" y="465" font-family="Arial,sans-serif" font-size="18" fill="#475569">Suspicious link:</text>
<text x="430" y="495" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#b42318">mparivahan-gov[.]okzk[.]com</text>
<text x="600" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#64748b">No real phone, vehicle or challan identifiers shown</text>
<rect x="365" y="635" width="470" height="32" rx="16" fill="#fff1f0"/>
<text x="600" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#b42318">ILLUSTRATION — NOT THE ORIGINAL SMS</text>
</svg>